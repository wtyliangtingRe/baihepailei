name: baihepailei

services:
  web:
    build:
      context: .
    image: baihepailei:initial-release
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BAIHEPAILEI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      SITE_OWNER_EMAIL: ${SITE_OWNER_EMAIL:-}
      NEXT_PUBLIC_MEDIA_MODE: ${NEXT_PUBLIC_MEDIA_MODE:-enhanced}
      NEXT_PUBLIC_FEEDBACK_EMAIL: ${NEXT_PUBLIC_FEEDBACK_EMAIL:-}
      NEXT_PUBLIC_FEEDBACK_FORM_URL: ${NEXT_PUBLIC_FEEDBACK_FORM_URL:-}
      NEXT_PUBLIC_FEEDBACK_ISSUE_URL: ${NEXT_PUBLIC_FEEDBACK_ISSUE_URL:-}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
