services:
  postgres:
    image: postgres:17-alpine
    container_name: baihepailei-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: baihe
      POSTGRES_PASSWORD: CHANGE_ME_DEV_PASSWORD
      POSTGRES_DB: baihepailei
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baihe -d baihepailei"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
