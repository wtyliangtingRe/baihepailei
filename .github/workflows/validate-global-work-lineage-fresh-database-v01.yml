name: Validate Global Work Lineage fresh database v01

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/validate-global-work-lineage-fresh-database-v01.yml'
      - '.github/workflows/validate-radar-*.yml'
      - 'next.config.mjs'
      - 'tsconfig.json'
      - 'payload.config.ts'
      - 'payload-types.ts'
      - 'database/global-work-lineage-v01/**'
      - 'scripts/work-lineage/**'
      - 'tests/fixtures/global-work-lineage-fresh-database-v01/**'
      - 'docs/GLOBAL-WORK-LINEAGE-FRESH-DATABASE-v01.md'
      - 'config/global-work-lineage-fresh-database-import-v01.lock.json'
      - 'src/lib/work-lineage/**'
      - 'src/access/**'
      - 'src/collections/**'
      - 'src/migrations/**'
      - 'src/app/(payload)/**'
      - 'src/app/(frontend)/layout.tsx'
      - 'src/app/(frontend)/feedback/**'
      - 'src/app/(frontend)/account/**'
      - 'src/app/(frontend)/me/**'
      - 'src/app/(frontend)/api/account/**'
      - 'src/app/(frontend)/api/comments/**'
      - 'src/app/(frontend)/api/personnel/**'
      - 'src/app/(frontend)/api/studio/**'
      - 'src/app/(frontend)/api/work-lineage/**'
      - 'src/app/(frontend)/page.tsx'
      - 'src/app/(frontend)/browse/page.tsx'
      - 'src/app/(frontend)/works/**'
      - 'src/app/(frontend)/search/page.tsx'
      - 'src/app/(frontend)/ratings/page.tsx'
      - 'src/app/(frontend)/radar/**'
      - 'src/app/(frontend)/creators/**'
      - 'src/app/(frontend)/organizations/**'
      - 'src/app/(frontend)/evidence/**'
      - 'src/app/(frontend)/recommendations/page.tsx'
      - 'src/app/(frontend)/updates/page.tsx'
      - 'src/app/(frontend)/rules/[slug]/page.tsx'
      - 'src/app/(frontend)/terms/[slug]/page.tsx'
      - 'tests/global-work-lineage-runtime-repository-v01.test.mjs'
      - 'package.json'
      - '.env.example'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-work-lineage-fresh-database-v01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-mode:
    runs-on: ubuntu-24.04
    outputs:
      legacy_database: ${{ steps.detect.outputs.legacy_database }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        name: Detect versioned public-release runtime
        shell: bash
        run: |
          set -euo pipefail
          if test -f data/public-release/v1/manifest.json \
            && grep -q '"validate:release"' package.json; then
            echo 'legacy_database=false' >> "$GITHUB_OUTPUT"
            echo 'Versioned public-release runtime detected; legacy PostgreSQL fixture integration is retired for this branch.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'legacy_database=true' >> "$GITHUB_OUTPUT"
          fi

  fixture-integration:
    needs: runtime-mode
    if: ${{ needs.runtime-mode.outputs.legacy_database == 'true' }}
    # Service containers require a Docker-capable runner; the long-lived WSL runner may not have Docker integration enabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Expose PostgreSQL service client
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t postgres_containers < <(
            docker ps \
              --filter status=running \
              --filter ancestor=postgres:17-alpine \
              --format '{{.ID}}'
          )
          test "${#postgres_containers[@]}" -eq 1
          postgres_container="${postgres_containers[0]}"
          printf 'POSTGRES_SERVICE_CONTAINER=%s\n' "$postgres_container" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/psql" <<'PSQL_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          test -n "${POSTGRES_SERVICE_CONTAINER:-}"
          input_file=''
          psql_args=()
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --file)
                test "$#" -ge 2
                input_file="$2"
                shift 2
                ;;
              --file=*)
                input_file="${1#--file=}"
                shift
                ;;
              *)
                psql_args+=("$1")
                shift
                ;;
            esac
          done
          if [ -n "$input_file" ]; then
            input_path="$(realpath "$input_file")"
            input_dir="$(dirname "$input_path")"
            input_name="$(basename "$input_path")"
            container_dir="/tmp/psql-wrapper-$"
            docker exec "$POSTGRES_SERVICE_CONTAINER" \
              mkdir -p "$container_dir"
            docker cp "$input_dir/." \
              "$POSTGRES_SERVICE_CONTAINER:$container_dir/"
            set +e
            docker exec -i \
              --workdir "$container_dir" \
              -e "PGPASSWORD=${PGPASSWORD:-}" \
              "$POSTGRES_SERVICE_CONTAINER" \
              psql "${psql_args[@]}" --file="$input_name"
            status="$?"
            set -e
            docker exec "$POSTGRES_SERVICE_CONTAINER" \
              rm -rf "$container_dir"
            exit "$status"
          fi
          exec docker exec -i \
            -e "PGPASSWORD=${PGPASSWORD:-}" \
            "$POSTGRES_SERVICE_CONTAINER" \
            psql "${psql_args[@]}"
          PSQL_WRAPPER
          chmod 0700 "$RUNNER_TEMP/bin/psql"
          export POSTGRES_SERVICE_CONTAINER="$postgres_container"
          "$RUNNER_TEMP/bin/psql" \
            -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'SELECT 1'
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Parse tools and check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/work-lineage/prepare_fresh_global_work_lineage_database_v01.py \
            scripts/work-lineage/provision_global_work_lineage_rows_v01.py \
            scripts/work-lineage/run_fresh_global_work_lineage_cutover_v01.py \
            scripts/work-lineage/validate_fresh_global_work_lineage_database_v01.py \
            scripts/work-lineage/validate_fresh_global_work_lineage_runtime_boundary_v01.py \
            tests/fixtures/global-work-lineage-fresh-database-v01/build_fixture.py \
            tests/fixtures/global-work-lineage-fresh-database-v01/build_provision_fixture.py \
            tests/test_provision_global_work_lineage_rows_v01.py
          python3 -m unittest -v tests.test_provision_global_work_lineage_rows_v01
          node --experimental-strip-types --test \
            tests/global-work-lineage-runtime-repository-v01.test.mjs
          python3 scripts/work-lineage/validate_fresh_global_work_lineage_runtime_boundary_v01.py \
            --repo-root . --out "$RUNNER_TEMP/runtime-boundary.json"
          git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Build deterministic formal fixture and prepare twice
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/formal"
          lock="$RUNNER_TEMP/fixture.lock.json"
          python3 tests/fixtures/global-work-lineage-fresh-database-v01/build_fixture.py \
            --out "$fixture" --lock "$lock"
          python3 scripts/work-lineage/prepare_fresh_global_work_lineage_database_v01.py \
            --formal-package "$fixture" --lock "$lock" \
            --out "$RUNNER_TEMP/prepared1" --proof "$RUNNER_TEMP/prepare1.json" >/dev/null
          python3 scripts/work-lineage/prepare_fresh_global_work_lineage_database_v01.py \
            --formal-package "$fixture" --lock "$lock" \
            --out "$RUNNER_TEMP/prepared2" --proof "$RUNNER_TEMP/prepare2.json" >/dev/null
          diff -ru "$RUNNER_TEMP/prepared1" "$RUNNER_TEMP/prepared2"
          cmp "$RUNNER_TEMP/prepare1.json" "$RUNNER_TEMP/prepare2.json"

      - name: Reject non-empty target, then import into a fresh database
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/formal"
          lock="$RUNNER_TEMP/fixture.lock.json"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE lineage_reject_nonempty'
          psql -h localhost -U postgres -d lineage_reject_nonempty -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE old_runtime_table (id integer PRIMARY KEY)'
          if python3 scripts/work-lineage/prepare_fresh_global_work_lineage_database_v01.py \
            --formal-package "$fixture" --lock "$lock" \
            --out "$RUNNER_TEMP/reject-prepared" \
            --execute --database-url 'postgresql://postgres:postgres@localhost:5432/lineage_reject_nonempty'; then
            echo 'non-empty database was incorrectly accepted' >&2
            exit 1
          fi
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE lineage_fresh'
          python3 scripts/work-lineage/prepare_fresh_global_work_lineage_database_v01.py \
            --formal-package "$fixture" --lock "$lock" \
            --out "$RUNNER_TEMP/import-prepared" \
            --execute --database-url 'postgresql://postgres:postgres@localhost:5432/lineage_fresh' \
            --proof "$RUNNER_TEMP/import.json" >/dev/null

      - name: Prove insert-only provision on a disposable database
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/formal"
          lock="$RUNNER_TEMP/fixture.lock.json"
          release_ref='fixture/global-work-lineage-v01/provision-writer-v01'
          database_url='postgresql://postgres:postgres@localhost:5432/lineage_provision'
          package_a="$RUNNER_TEMP/provision-package-a.json"
          package_b="$RUNNER_TEMP/provision-package-b.json"
          gate_a="$RUNNER_TEMP/provision-gate-a.json"
          gate_b="$RUNNER_TEMP/provision-gate-b.json"

          python3 tests/fixtures/global-work-lineage-fresh-database-v01/build_provision_fixture.py \
            --package "$package_a" --gate "$gate_a" --release-ref "$release_ref"
          python3 tests/fixtures/global-work-lineage-fresh-database-v01/build_provision_fixture.py \
            --package "$package_b" --gate "$gate_b" --release-ref "$release_ref"
          cmp "$package_a" "$package_b"
          cmp "$gate_a" "$gate_b"

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE lineage_provision'
          python3 scripts/work-lineage/prepare_fresh_global_work_lineage_database_v01.py \
            --formal-package "$fixture" --lock "$lock" \
            --out "$RUNNER_TEMP/provision-base-prepared" \
            --execute --database-url "$database_url" \
            --proof "$RUNNER_TEMP/provision-base-import.json" >/dev/null

          original_sha_before="$(
            psql -h localhost -U postgres -d lineage_provision -A -t -v ON_ERROR_STOP=1 \
              -c "SELECT document_sha256 FROM global_work_lineage_v01.work_lineages WHERE work_id = '100'"
          )"
          test -n "$original_sha_before"

          python3 scripts/work-lineage/provision_global_work_lineage_rows_v01.py \
            --package "$package_a" --release-ref "$release_ref" \
            --out-dir "$RUNNER_TEMP/provision-offline" >/dev/null
          package_sha="$(sha256sum "$package_a" | awk '{print $1}')"
          python3 scripts/work-lineage/provision_global_work_lineage_rows_v01.py \
            --package "$package_a" --release-ref "$release_ref" \
            --out-dir "$RUNNER_TEMP/provision-apply" \
            --gate "$gate_a" --apply --database-url "$database_url" \
            --confirm-release-ref "$release_ref" \
            --confirm-package-sha256 "$package_sha" >/dev/null

          test "$(
            psql -h localhost -U postgres -d lineage_provision -A -t -v ON_ERROR_STOP=1 \
              -c 'SELECT count(*) FROM global_work_lineage_v01.work_lineages'
          )" = '4'
          original_sha_after="$(
            psql -h localhost -U postgres -d lineage_provision -A -t -v ON_ERROR_STOP=1 \
              -c "SELECT document_sha256 FROM global_work_lineage_v01.work_lineages WHERE work_id = '100'"
          )"
          test "$original_sha_after" = "$original_sha_before"
          projected="$(
            psql -h localhost -U postgres -d lineage_provision -A -t -F '|' -v ON_ERROR_STOP=1 \
              -c "SELECT work_id, canonical_title, audit_run_ref FROM global_work_lineage_v01.work_lineages WHERE work_id IN ('102', '103') ORDER BY work_id"
          )"
          expected="$(printf '%s\n%s' \
            '102|Fixture Provisioned New Audit Work|global-audit-run-v01:test-provision-writer' \
            '103|Fixture Provisioned Existing Audit Work|global-audit-run-v01:test-fresh-database')"
          test "$projected" = "$expected"
          stable_set="$(
            psql -h localhost -U postgres -d lineage_provision -A -t -F '|' -v ON_ERROR_STOP=1 \
              -c 'SELECT work_id, document_sha256 FROM global_work_lineage_v01.work_lineages ORDER BY length(work_id), work_id'
          )"

          if python3 scripts/work-lineage/provision_global_work_lineage_rows_v01.py \
            --package "$package_a" --release-ref "$release_ref" \
            --out-dir "$RUNNER_TEMP/provision-reapply" \
            --gate "$gate_a" --apply --database-url "$database_url" \
            --confirm-release-ref "$release_ref" \
            --confirm-package-sha256 "$package_sha"; then
            echo 'duplicate provision package was incorrectly accepted' >&2
            exit 1
          fi
          test "$(
            psql -h localhost -U postgres -d lineage_provision -A -t -F '|' -v ON_ERROR_STOP=1 \
              -c 'SELECT work_id, document_sha256 FROM global_work_lineage_v01.work_lineages ORDER BY length(work_id), work_id'
          )" = "$stable_set"

          python3 - "$RUNNER_TEMP/provision-offline/receipt.json" "$RUNNER_TEMP/provision-apply/receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          offline = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          applied = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert offline['status'] == 'PASS_OFFLINE_VALIDATED'
          assert offline['execution']['databaseWrite'] is False
          assert applied['status'] == 'PASS_APPLIED'
          assert applied['execution']['insertProvenanceObjects'] == 1
          assert applied['execution']['insertWorkRows'] == 2
          assert applied['execution']['updateRows'] == 0
          assert applied['execution']['upsertRows'] == 0
          PY
          rm -f "$package_a" "$package_b" "$gate_a" "$gate_b"
          rm -rf "$RUNNER_TEMP/provision-base-prepared"

      - name: Delete every package/input artifact and validate database alone
        shell: bash
        run: |
          set -euo pipefail
          lock="$RUNNER_TEMP/fixture.lock.json"
          validator="$RUNNER_TEMP/validate-db.py"
          cp scripts/work-lineage/validate_fresh_global_work_lineage_database_v01.py "$validator"
          rm -rf \
            "$RUNNER_TEMP/formal" \
            "$RUNNER_TEMP/prepared1" \
            "$RUNNER_TEMP/prepared2" \
            "$RUNNER_TEMP/reject-prepared" \
            "$RUNNER_TEMP/import-prepared"
          test ! -e "$RUNNER_TEMP/formal"
          test ! -e "$RUNNER_TEMP/import-prepared"
          cd "$RUNNER_TEMP"
          psql -h localhost -U postgres -d lineage_fresh -v ON_ERROR_STOP=1 \
            -c 'CREATE VIEW global_work_lineage_v01.hidden_compatibility_bridge AS SELECT work_id FROM global_work_lineage_v01.work_lineages'
          if python3 "$validator" \
            --database-url 'postgresql://postgres:postgres@localhost:5432/lineage_fresh' \
            --lock "$lock"; then
            echo 'unexpected target-schema relation was incorrectly accepted' >&2
            exit 1
          fi
          psql -h localhost -U postgres -d lineage_fresh -v ON_ERROR_STOP=1 \
            -c 'DROP VIEW global_work_lineage_v01.hidden_compatibility_bridge'
          python3 "$validator" \
            --database-url 'postgresql://postgres:postgres@localhost:5432/lineage_fresh' \
            --lock "$lock" --out "$RUNNER_TEMP/database-proof.json"

      - name: Prove no compatibility or legacy runtime path
        shell: bash
        run: |
          set -euo pipefail
          test "$(find database/global-work-lineage-v01 -maxdepth 1 -type f -printf '%f\n' | sort)" = 'schema.sql'
          test "$(grep -ciE '^[[:space:]]*CREATE TABLE ' database/global-work-lineage-v01/schema.sql)" = 2
          if grep -RInE 'CREATE[[:space:]]+(VIEW|MATERIALIZED VIEW)|FOREIGN[[:space:]]+DATA|postgres_fdw|dblink|IF[[:space:]]+NOT[[:space:]]+EXISTS|ON[[:space:]]+CONFLICT|MERGE[[:space:]]+INTO' \
            database/global-work-lineage-v01; then
            echo 'forbidden database compatibility construct found' >&2
            exit 1
          fi
          if grep -RInE '@payload-config|from .*payload|search-index|detail-index|radar-public-' \
            'src/app/(frontend)/page.tsx' \
            'src/app/(frontend)/browse/page.tsx' \
            'src/app/(frontend)/works' \
            'src/app/(frontend)/search/page.tsx' \
            'src/app/(frontend)/ratings/page.tsx' \
            'src/app/(frontend)/radar' \
            'src/app/(frontend)/creators' \
            'src/app/(frontend)/organizations' \
            'src/app/(frontend)/evidence' \
            'src/app/(frontend)/recommendations/page.tsx' \
            'src/app/(frontend)/updates/page.tsx'; then
            echo 'forbidden legacy public reader found' >&2
            exit 1
          fi
          grep -q 'requiresEmptyDatabase' "$RUNNER_TEMP/database-proof.json"
          sha256sum "$RUNNER_TEMP/database-proof.json"

      - name: Upload integration proofs
        uses: actions/upload-artifact@v4
        with:
          name: global-work-lineage-fresh-database-fixture-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/prepare1.json
            ${{ runner.temp }}/import.json
            ${{ runner.temp }}/database-proof.json
            ${{ runner.temp }}/runtime-boundary.json
            ${{ runner.temp }}/provision-base-import.json
            ${{ runner.temp }}/provision-offline/receipt.json
            ${{ runner.temp }}/provision-apply/receipt.json
          if-no-files-found: warn
          retention-days: 30
