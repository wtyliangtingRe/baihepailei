name: Audit 531 new-Research baseline bindings
on:
  push:
    branches: [worker/identity-audit-new-research-531-20260906]
    paths:
      - '.github/workflows/audit-new-research-531-baseline-bindings.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worker/identity-audit-new-research-531-20260906
          fetch-depth: 1
      - name: Inspect baseline bindings
        run: |
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          p=Path('data/public-release/v1/metadata-20260905-v01/baseline-bindings.json.gz')
          with gzip.open(p,'rt',encoding='utf-8') as f:
              data=json.load(f)
          out=Path('tmp/new-research-531-identity-audit'); out.mkdir(parents=True,exist_ok=True)
          # normalize arbitrary top-level container into candidate objects
          candidates=[]
          def walk(v,path=''):
              if isinstance(v,dict):
                  wid=v.get('workId')
                  if wid is not None and str(wid).isdigit() and 32590<=int(wid)<=33120:
                      candidates.append({'_path':path,**v})
                  for k,x in v.items(): walk(x,f'{path}/{k}')
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f'{path}/{i}')
          walk(data)
          # dedupe exact serialized objects
          seen=set(); rows=[]
          for r in candidates:
              s=json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))
              if s not in seen: seen.add(s); rows.append(r)
          (out/'baseline-binding-matches-32590-33120.jsonl').write_text(''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for r in rows),encoding='utf-8')
          summary={
              'schemaVersion':'baseline-binding-audit-v1',
              'workIdRange':['32590','33120'],
              'targetCount':531,
              'matchingObjects':len(rows),
              'matchingWorkIds':len({str(r.get('workId')) for r in rows}),
              'topLevelType':type(data).__name__,
              'topLevelKeys':list(data.keys())[:50] if isinstance(data,dict) else None,
              'state':'baseline_binding_audited_no_title_matching'
          }
          (out/'baseline-binding-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit audit
        run: |
          git config user.name 'baihepailei-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp/new-research-531-identity-audit
          git commit -m 'audit: inspect baseline bindings for WorkId 32590-33120'
          git push origin HEAD:worker/identity-audit-new-research-531-20260906
