name: Validate Radar Public Metrics Source Schema Apply Once v01

on:
  pull_request:
    paths:
      - "scripts/radar/run-radar-public-metrics-source-schema-apply-once-v01.ps1"
      - "tests/radar-public-metrics-source-schema-apply-once.test.mjs"
      - "docs/guides/radar-public-metrics-source-schema-apply-once-v01.md"
      - "docs/guides/radar-public-metrics-source-schema-rollback-v01.md"
      - ".github/workflows/validate-radar-public-metrics-source-schema-apply-once-v01.yml"
      - "src/collections/RadarPublicRatings.ts"
      - "src/migrations/20260803_102741_radar_public_metrics_v01.ts"
      - "src/migrations/20260803_102741_radar_public_metrics_v01.json"
      - "src/migrations/index.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse PowerShell executor
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path `
              '.\scripts\radar\run-radar-public-metrics-source-schema-apply-once-v01.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run source schema apply-once contract tests
        run: |
          node --test \
            tests/radar-public-metrics-schema.test.mjs \
            tests/radar-public-metrics-migration.test.mjs \
            tests/radar-public-metrics-production-preflight.test.mjs \
            tests/radar-public-metrics-source-schema-apply-once.test.mjs

      - name: Enforce exact binding and advisory lock
        shell: bash
        run: |
          set -euo pipefail

          script='scripts/radar/run-radar-public-metrics-source-schema-apply-once-v01.ps1'

          for value in \
            b74ca37648688cb8f475acdbf304186ac36753ff \
            978a893e6f72bea8bb292c5dff99dfefb957e22e \
            c2fe7847ee8b60b439f8e92025437937ceff06d5 \
            RADAR-PUBLIC-METRICS-10563-0001 \
            825294f1a7562dfb2a94ca9d37f7efd79a9300d1af17ae6598db3f3ac02f7d13 \
            35d14fb183a0e8ae34525ad6234a3a0e03ba42f28e6091598eef1ddf369694d0 \
            d1721811438194b4783d0d05dbb9681d5ed8c2cc052145f09fb0747fcc4abe2f \
            20260803_102741_radar_public_metrics_v01
          do
            grep -q "$value" "$script"
          done

          grep -q 'pg_try_advisory_lock' "$script"
          grep -q 'RADAR_SOURCE_SCHEMA_LOCK_ACQUIRED' "$script"
          grep -q 'pg_terminate_backend' "$script"
          grep -q 'ASCII.GetByteCount($ApplicationName)' "$script"
          grep -q 'objsubid = 2' "$script"
          grep -q 'backendPid = $BackendPid' "$script"
          grep -q 'pid <> $($Lock.backendPid)' "$script"

      - name: Enforce one migration command and no metric import
        shell: bash
        run: |
          set -euo pipefail

          script='scripts/radar/run-radar-public-metrics-source-schema-apply-once-v01.ps1'

          test "$(grep -c 'pnpm exec payload migrate' "$script")" -eq 1

          ! grep -EIn \
            'payload\.(create|update|delete)|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+radar_public_ratings|DELETE[[:space:]]+FROM[[:space:]]+radar_public_ratings' \
            "$script"

          ! grep -EIn \
            'run-unified-rating-incremental-production-apply-once|execute-radar-unified-release-production' \
            "$script"

          grep -q 'metricImportExecuted = $false' "$script"
          grep -q 'historicalApplyOnceRerun = $false' "$script"
          grep -q 'productionAuthorization -ne $true' "$script"

      - name: Require disposable rehearsal and post-verification
        shell: bash
        run: |
          set -euo pipefail

          script='scripts/radar/run-radar-public-metrics-source-schema-apply-once-v01.ps1'
          guide='docs/guides/radar-public-metrics-source-schema-apply-once-v01.md'
          rollback='docs/guides/radar-public-metrics-source-schema-rollback-v01.md'

          grep -q 'POSTGRES_HOST_AUTH_METHOD=trust' "$script"
          grep -q '127.0.0.1:${TempPort}:5432' "$script"
          grep -q 'docker rm -f -v $TempContainer' "$script"
          grep -q 'nonEmptyMetricRows' "$script"
          grep -q 'requiresMetricReviewNull' "$script"

          grep -q '36 -> 44' "$guide"
          grep -q '9 -> 10' "$guide"
          grep -q 'Never rerun' "$guide"
          grep -q 'apply-time backup' "$rollback"
          grep -q "Do not run the migration's \`down()\` function" "$rollback"

      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
