name: Validate Radar Public Metrics Production Gate v01

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-radar-public-metrics-production-gate-v01.yml'
      - 'config/radar-public-metrics-production-gate-v01.lock.json'
      - 'docs/guides/radar-public-metrics-production-gate-v01.md'
      - 'tests/radar-public-metrics-production-gate-lock.test.mjs'
      - 'tests/radar-public-metrics-production-runtime-contract.test.mjs'
      - 'tests/radar-public-metrics-production-execution-gate.test.mjs'
      - 'scripts/radar/radar-public-metrics-production-contract-v01.mjs'
      - 'scripts/radar/run-radar-public-metrics-production-import-v01.mjs'
      - 'scripts/radar/run-radar-public-metrics-production-apply-once-v01.ps1'
      - 'scripts/radar/rehearse-radar-public-metrics-production-gate-v01.ps1'
      - 'src/app/(payload)/api/radar-public-metrics-production-marker/route.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check scripts/radar/radar-public-metrics-production-contract-v01.mjs
          node --check scripts/radar/run-radar-public-metrics-production-import-v01.mjs

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/radar/run-radar-public-metrics-production-apply-once-v01.ps1',
            'scripts/radar/rehearse-radar-public-metrics-production-gate-v01.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error "${file}:$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)"
              }
              throw "PowerShell syntax check failed: $file"
            }
          }

      - name: Run production gate tests
        run: |
          node --test             tests/radar-public-metrics-production-gate-lock.test.mjs             tests/radar-public-metrics-production-runtime-contract.test.mjs             tests/radar-public-metrics-production-execution-gate.test.mjs

      - name: Enforce bindings and closed production authorization
        shell: bash
        run: |
          set -euo pipefail
          lock='config/radar-public-metrics-production-gate-v01.lock.json'
          importer='scripts/radar/run-radar-public-metrics-production-import-v01.mjs'
          runner='scripts/radar/run-radar-public-metrics-production-apply-once-v01.ps1'
          rehearsal='scripts/radar/rehearse-radar-public-metrics-production-gate-v01.ps1'

          grep -q '"stage": "production_gate_replacement_rehearsal_schema_remediation_ready"' "$lock"
          grep -q '"productionAuthorization": false' "$lock"
          grep -q '"metricImportAuthorized": false' "$lock"
          grep -q '"postMergeAuthorizationArtifactRequired": true' "$lock"
          grep -q '"finalDisposableRehearsalAccepted": false' "$lock"
          grep -q '"finalReviewRemediationRequired": true' "$lock"
          grep -q '"finalReviewRemediationRehearsalRequired": true' "$lock"
          grep -q '"rehearsalAuthorizationFreshBackupBindingRequired": true' "$lock"
          grep -q '"replacementRehearsalSchemaRemediationRequired": true' "$lock"
          grep -q '"metricPatch": 0' "$lock"
          grep -q '"productionWriteAuthorized": false' "$lock"
          grep -q '187021c234751ef9ea3cd69bc9830e914b926ab6c68378bdf874ee77c23d5140' "$lock"
          grep -q '4aaeead0ae65da6c475e91d72125602d6315cff3b7d698aa760fa3068c7cd9c4' "$lock"
          grep -q '6f7cea1cfc32317ca6aaa23bdc78cc902badb995a45f2a97ab0107716910a216' "$lock"
          grep -q '"sourceDatabaseWrite": false' "$lock"
          grep -q '"productionAuthorization": false' "$lock"
          ! grep -q '"productionAuthorization": true' "$lock"
          ! grep -q '"metricImportAuthorized": true' "$lock"

          grep -q 'RUN-RADAR-PUBLIC-METRICS-PRODUCTION-IMPORT-V01' "$importer"
          grep -q "method: 'PATCH'" "$importer"
          grep -q 'postCreate: 0' "$importer"
          grep -q 'put: 0' "$importer"
          grep -q 'delete: 0' "$importer"

          grep -q 'pg_advisory_lock' "$runner"
          grep -q 'durable apply-control marker' "$runner"
          grep -q 'automaticRetryAllowed = \$false' "$runner"
          grep -q 'automaticRollbackAllowed = \$false' "$runner"
          grep -q 'operatorMustInspectBeforeAnyFurtherAction' "$runner"
          grep -q 'Stop-RadarIncrementalWriters' "$runner"
          grep -q 'SELECT current_database();' "$runner"
          grep -q 'targetDatabaseWrite = $true' "$runner"
          grep -q "sourceDatabaseWrite = (\$ExecutionMode -eq 'production')" "$runner"
          grep -q 'applyControlSha256 = $ControlSha256' "$runner"
          grep -q 'MaximumBackupAgeMinutes = 30' "$runner"
          grep -q 'MaximumBackupAuthorizationGapMinutes = 15' "$runner"
          grep -q 'MaximumBackupFileTimestampSkewMinutes = 5' "$runner"
          grep -q 'freshBackup.sourceContainerId' "$runner"
          grep -q 'FreshBackupFileTimestampSkewMinutes' "$runner"
          grep -q 'WritersStopped -and -not $WritersRestarted' "$runner"

          grep -q 'requestImmediateProductionApplyConfirmation' "$importer"
          grep -q 'APPLY-RADAR-PUBLIC-METRICS-10563-NOW-I-ACCEPT-FIRST-SOURCE-PATCH' "$importer"

          grep -q 'pg_dump' "$rehearsal"
          grep -q 'pg_restore' "$rehearsal"
          grep -q 'sourceDatabaseUnchanged = \$true' "$rehearsal"
          grep -q 'productionAuthorization = \$false' "$rehearsal"
          grep -q 'apply-control-marker.json' "$rehearsal"
          grep -q "applyControlState = 'completed'" "$rehearsal"
          grep -q 'GetByteCount($TempDatabase) -gt 63' "$rehearsal"
          grep -q 'createdAt = $BackupCreatedAt' "$rehearsal"
          grep -q 'sourceContainerId = $ExpectedSourceContainerId' "$rehearsal"
          grep -q 'sourceDatabaseUser = $DatabaseUser' "$rehearsal"

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
