name: Validate Radar Public Ratings Migration v01

on:
  pull_request:
    paths:
      - "src/collections/RadarPublicRatings.ts"
      - "src/collections/RadarPublicConclusions.ts"
      - "src/lib/radar/conclusionNormalizer.mjs"
      - "payload.config.ts"
      - ".env.example"
      - "src/migrations/**"
      - "config/radar-public-ratings-schema-v01.json"
      - "scripts/radar/lib/unified-rating-release-plan-v01.mjs"
      - "scripts/radar/run-unified-rating-incremental-production-import-9988-v01.mjs"
      - "scripts/radar/prepare-radar-public-ratings-migration-v01.ps1"
      - "tests/radar-public-ratings-schema.test.mjs"
      - "tests/radar-public-ratings-migration-preparation.test.mjs"
      - "tests/radar-unified-rating-release-plan-v01.test.mjs"
      - "tests/radar-v05-persistence-standardization.test.mjs"
      - "docs/guides/radar-public-ratings-migration-v01.md"
      - ".github/workflows/validate-radar-public-ratings-migration-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse locked schema contract
        run: node -e "JSON.parse(require('node:fs').readFileSync('config/radar-public-ratings-schema-v01.json','utf8'))"
      - name: Parse PowerShell preparer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\radar\prepare-radar-public-ratings-migration-v01.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Run Release planner and ratings migration tests
        run: |
          node --test \
            tests/radar-unified-rating-release-plan-v01.test.mjs \
            tests/radar-public-ratings-schema.test.mjs \
            tests/radar-public-ratings-migration-preparation.test.mjs \
            tests/radar-v05-persistence-standardization.test.mjs
      - name: Enforce preparation-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'pnpm[[:space:]]+(install|i)([[:space:]]|$)|payload[[:space:]]+migrate([[:space:]]|$)|docker[[:space:]]+compose|pg_dump|psql' \
            scripts/radar/prepare-radar-public-ratings-migration-v01.ps1
          grep -q 'default_transaction_read_only=on' scripts/radar/prepare-radar-public-ratings-migration-v01.ps1
          grep -q 'DatabaseMigrate : False' scripts/radar/prepare-radar-public-ratings-migration-v01.ps1
          grep -q 'PayloadWrite    : False' scripts/radar/prepare-radar-public-ratings-migration-v01.ps1
          grep -q 'WorksMutation   : False' scripts/radar/prepare-radar-public-ratings-migration-v01.ps1
      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
