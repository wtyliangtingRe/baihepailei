name: Normalize incremental rehearsal process handle

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/repair-incremental-rehearsal-startup-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Normalize process-handle and startup-cleanup blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/radar/rehearse-unified-rating-incremental-release-9988-v02.ps1')
          text = path.read_text(encoding='utf-8')

          handle_block = (
              "  $process = Get-RadarActiveProcess $null\n"
              "  if ($null -eq $process -or -not ($process -is [System.Diagnostics.Process])) {\n"
              "    throw '临时 Payload 进程句柄无效。'\n"
              "  }\n"
          )
          pattern = re.compile(r'(?:' + re.escape(handle_block) + r')+')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected one consecutive process-handle region, found {len(matches)}')
          text = pattern.sub(handle_block, text, count=1)

          old = (
              "  Wait-IncrementalMarker $baseUrl $Nonce $Phase $DatabaseName $CandidateSha256 $process | Out-Null\n"
              "  return [pscustomobject]@{ Process = $process; BaseUrl = $baseUrl }\n"
          )
          hardened = (
              "  try {\n"
              "    Wait-IncrementalMarker $baseUrl $Nonce $Phase $DatabaseName $CandidateSha256 $process | Out-Null\n"
              "    return [pscustomobject]@{ Process = $process; BaseUrl = $baseUrl }\n"
              "  } catch {\n"
              "    Stop-RadarProcess $process\n"
              "    throw\n"
              "  }\n"
          )
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one startup cleanup target, found {text.count(old)}')
              text = text.replace(old, hardened)
          elif text.count(hardened) != 1:
              raise SystemExit(f'Expected one hardened startup block, found {text.count(hardened)}')

          if text.count(handle_block) != 1:
              raise SystemExit(f'Process-handle block count is {text.count(handle_block)}, expected 1')
          if text.count(hardened) != 1:
              raise SystemExit(f'Hardened startup block count is {text.count(hardened)}, expected 1')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Parse normalized PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath 'scripts/radar/rehearse-unified-rating-incremental-release-9988-v02.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell parse failed after process-handle normalization.'
          }
      - name: Commit normalization when changed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git add -- scripts/radar/rehearse-unified-rating-incremental-release-9988-v02.ps1
          if git diff --cached --quiet; then
            echo 'Process-handle block already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize incremental rehearsal process handle'
          git push origin "HEAD:$BRANCH"
