name: Release checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/initial-public-release-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:release
      - run: pnpm typecheck
      - run: pnpm build

