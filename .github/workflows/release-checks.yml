name: Release checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/initial-public-release-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:release
      - name: Audit public catalog merge
        id: merge_audit
        run: pnpm audit:merge
        env:
          MERGE_AUDIT_REPORT: merge-audit.json
      - name: Preserve merge audit report
        uses: actions/upload-artifact@v4
        with:
          name: public-merge-current-${{ steps.merge_audit.outputs.visibleWorks }}-removed-${{ steps.merge_audit.outputs.mergedAway }}-exactconflicts-${{ steps.merge_audit.outputs.sameProviderExactIdConflictGroups }}-safe-${{ steps.merge_audit.outputs.safeVisibleWorks }}-removed-${{ steps.merge_audit.outputs.safeMergedAway }}-ambiguous-${{ steps.merge_audit.outputs.safeAmbiguousTitleKeysSkipped }}-safeconflicts-${{ steps.merge_audit.outputs.safeExactConflictGroups }}-blocking-${{ steps.merge_audit.outputs.safeRatedWithBlockingTerminalGroups }}
          path: merge-audit.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm validate:ui
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke:public
