name: Extract pack-0001 material from locked RC

on:
  push:
    branches:
      - worker/extract-pack-0001-material-20260906
    paths:
      - .github/workflows/extract-pack-0001-material.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked RC branch
        uses: actions/checkout@v4
        with:
          ref: worker/extract-pack-0001-material-20260906
          fetch-depth: 1

      - name: Extract frontier metadata rows to UTF-8 JSONL
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib, json, pathlib

          root = pathlib.Path('.')
          src = root / 'data/public-release/v1/metadata-20260905-v01'
          out_dir = root / 'tmp/pack-0001-material-20260906'
          out_dir.mkdir(parents=True, exist_ok=True)
          out_jsonl = out_dir / 'frontier-workid-gte-38850.jsonl'
          out_summary = out_dir / 'summary.json'

          rows = []
          scanned = 0
          shards = []

          def work_id(obj):
              if not isinstance(obj, dict):
                  return None
              for key in ('workId', 'work_id', 'workID'):
                  if obj.get(key) is not None:
                      return str(obj[key])
              for key in ('work', 'identity', 'metadata', 'record'):
                  nested = obj.get(key)
                  if isinstance(nested, dict):
                      for kk in ('workId', 'work_id', 'workID'):
                          if nested.get(kk) is not None:
                              return str(nested[kk])
              return None

          for path in sorted(src.glob('metadata-*.jsonl.gz')):
              matched = 0
              with gzip.open(path, 'rt', encoding='utf-8') as fh:
                  for line_no, line in enumerate(fh, 1):
                      line = line.strip()
                      if not line:
                          continue
                      scanned += 1
                      obj = json.loads(line)
                      wid = work_id(obj)
                      try:
                          n = int(wid) if wid is not None else -1
                      except ValueError:
                          n = -1
                      if n >= 38850:
                          rows.append({
                              'workId': wid,
                              'sourceWebsiteCommit': 'a773ea6c20d87be437405d581b79e0c824713bee',
                              'sourceWebsiteFile': str(path.relative_to(root)),
                              'sourceLine': line_no,
                              'material': obj,
                          })
                          matched += 1
              if matched:
                  shards.append({'file': str(path.relative_to(root)), 'matched': matched})

          rows.sort(key=lambda r: int(r['workId']))
          with out_jsonl.open('w', encoding='utf-8', newline='\n') as f:
              for row in rows:
                  f.write(json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n')

          digest = hashlib.sha256(out_jsonl.read_bytes()).hexdigest()
          summary = {
              'sourceCommit': 'a773ea6c20d87be437405d581b79e0c824713bee',
              'sourceRelease': 'data/public-release/v1/metadata-20260905-v01',
              'filter': 'numeric workId >= 38850',
              'scannedRows': scanned,
              'matchedRows': len(rows),
              'firstWorkId': rows[0]['workId'] if rows else None,
              'lastWorkId': rows[-1]['workId'] if rows else None,
              'outputSha256': digest,
              'shards': shards,
              'authorityNote': 'Temporary extraction from locked website metadata only; not Research Freeze authority.'
          }
          out_summary.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Commit extraction to temporary branch
        shell: bash
        run: |
          git config user.name "baihepailei-worker"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/pack-0001-material-20260906
          git commit -m "ops: materialize locked RC frontier metadata for pack-0001 resolution"
          git push origin HEAD:worker/extract-pack-0001-material-20260906
