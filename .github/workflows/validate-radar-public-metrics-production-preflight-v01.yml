name: Validate Radar Public Metrics Production Preflight v01

on:
  pull_request:
    paths:
      - "scripts/radar/prepare-radar-public-metrics-production-preflight-v01.ps1"
      - "scripts/radar/plan-radar-public-metrics-overlay-v01.mjs"
      - "docs/guides/radar-public-metrics-production-preflight-v01.md"
      - "docs/guides/radar-public-metrics-overlay-v01.md"
      - "src/collections/RadarPublicRatings.ts"
      - "src/migrations/20260803_102741_radar_public_metrics_v01.ts"
      - "src/migrations/20260803_102741_radar_public_metrics_v01.json"
      - "src/migrations/index.ts"
      - "tests/radar-public-metrics-production-preflight.test.mjs"
      - "tests/radar-public-metrics-plan.test.mjs"
      - "tests/radar-public-metrics-schema.test.mjs"
      - "tests/radar-public-metrics-migration.test.mjs"
      - ".github/workflows/validate-radar-public-metrics-production-preflight-v01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse PowerShell preflight
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\radar\prepare-radar-public-metrics-production-preflight-v01.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run metrics and preflight regressions
        run: |
          node --test \
            tests/radar-live-pages.test.mjs \
            tests/collection-list-visual-headings.test.mjs \
            tests/radar-public-rating-bridge.test.mjs \
            tests/radar-public-metrics-schema.test.mjs \
            tests/radar-public-metrics-plan.test.mjs \
            tests/radar-public-metrics-migration.test.mjs \
            tests/radar-public-metrics-production-preflight.test.mjs

      - name: Enforce source-read-only and disposable-only migration boundary
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/radar/prepare-radar-public-metrics-production-preflight-v01.ps1'

          grep -q 'default_transaction_read_only=on' "$script"
          grep -q '127.0.0.1:${TempPort}:5432' "$script"
          grep -q "parsed.hostname !== '127.0.0.1'" "$script"
          test "$(grep -c 'pnpm exec payload migrate' "$script")" -eq 1
          grep -q 'docker rm -f -v $TempContainer' "$script"

          ! grep -EIn 'payload\.(create|update|delete)|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+radar_public_ratings|DELETE[[:space:]]+FROM[[:space:]]+radar_public_ratings' "$script"
          ! grep -EIn 'run-unified-rating-incremental-production-apply-once|execute-radar-unified-release-production' "$script"

          grep -q 'sourceMigration = $false' "$script"
          grep -q 'metricImport = $false' "$script"
          grep -q 'productionAuthorization = $false' "$script"
          grep -q 'historicalApplyOnceRerun = $false' "$script"

      - name: Require exact locked identities and reusable guide
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/radar/prepare-radar-public-metrics-production-preflight-v01.ps1'
          guide='docs/guides/radar-public-metrics-production-preflight-v01.md'

          for value in \
            b5ffbe006913218d32b96c131074b7740bf827a0 \
            c2fe7847ee8b60b439f8e92025437937ceff06d5 \
            RADAR-PUBLIC-METRICS-10563-0001 \
            da4b52eae91224a8bab46aebff69734c6a3d2bc3005de415b027a9e4eba6226d \
            1bdfda49f4f72a823efc86de42c565d3bdef162136aef697d0dc1d3bb343a946 \
            20260803_102741_radar_public_metrics_v01
          do
            grep -q "$value" "$script"
            grep -q "$value" "$guide"
          done

          grep -q '36 -> 44' "$guide"
          grep -q 'Never rerun' "$guide"
          grep -q 'sourceMigrationExecuted = false' "$guide"
          grep -q 'metricImportExecuted = false' "$guide"
          grep -q 'productionAuthorization = false' "$guide"

      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
