name: Validate Radar Public Records Plan v01

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-radar-public-records-plan-v01.yml'
      - 'docs/radar-public-records-plan-v01.md'
      - 'src/collections/RadarPublicRecords.ts'
      - 'scripts/radar/lib/public-release-plan-v01.mjs'
      - 'scripts/radar/plan-public-release-v01.mjs'
      - 'tests/radar-public-records-schema.test.mjs'
      - 'tests/radar-public-release-plan-v01.test.mjs'

permissions:
  contents: read

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse planner
        run: |
          node --check scripts/radar/lib/public-release-plan-v01.mjs
          node --check scripts/radar/plan-public-release-v01.mjs
      - name: Run schema and planner tests
        run: |
          node --test \
            tests/radar-public-records-schema.test.mjs \
            tests/radar-public-release-plan-v01.test.mjs \
            tests/radar-public-release-v01.test.mjs
      - name: Confirm locked migration remains separate from planning changes
        run: |
          grep -q "RadarPublicRecords" payload.config.ts
          test -f src/migrations/20260801_101546_current_schema_baseline_before_radar_public_records_v01.ts
          test -f src/migrations/20260801_101551_radar_public_records_v01.ts
          git diff --exit-code origin/${{ github.base_ref }}...HEAD -- \
            payload.config.ts \
            src/migrations/20260801_101546_current_schema_baseline_before_radar_public_records_v01.ts \
            src/migrations/20260801_101546_current_schema_baseline_before_radar_public_records_v01.json \
            src/migrations/20260801_101551_radar_public_records_v01.ts \
            src/migrations/20260801_101551_radar_public_records_v01.json \
            src/migrations/index.ts
          test "$(grep -Ec "method: '(POST|PATCH|PUT|DELETE)'" scripts/radar/plan-public-release-v01.mjs)" -eq 1
          grep -q '/api/users/login' scripts/radar/plan-public-release-v01.mjs
          grep -q "method: 'POST'" scripts/radar/plan-public-release-v01.mjs
          ! grep -E "method: '(PATCH|PUT|DELETE)'|payload migrate" scripts/radar/plan-public-release-v01.mjs
          grep -q 'publicRecordMutation: false' scripts/radar/plan-public-release-v01.mjs
          grep -q 'worksMutation: false' scripts/radar/plan-public-release-v01.mjs
      - name: Check diff whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
