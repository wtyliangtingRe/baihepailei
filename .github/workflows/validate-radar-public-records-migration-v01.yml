name: Validate Radar Public Records Migration v01

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/validate-radar-public-records-migration-v01.yml'
      - 'scripts/radar/prepare-radar-public-records-migration-v01.ps1'
      - 'scripts/radar/prepare-radar-public-record-fact-value-text-migration-v01.ps1'
      - 'scripts/radar/prepare-radar-public-record-evidence-role-migration-v01.ps1'
      - 'tests/radar-public-records-migration-preparation.test.mjs'
      - 'tests/radar-public-record-fact-value-text-migration-preparation.test.mjs'
      - 'tests/radar-public-record-evidence-role-migration-preparation.test.mjs'
      - 'src/collections/RadarPublicRecords.ts'
      - 'payload.config.ts'
      - '.env.example'
      - 'src/migrations/**'

permissions:
  contents: read

jobs:
  validate-migration-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse PowerShell preparers
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($path in @(
            'scripts/radar/prepare-radar-public-records-migration-v01.ps1',
            'scripts/radar/prepare-radar-public-record-fact-value-text-migration-v01.ps1',
            'scripts/radar/prepare-radar-public-record-evidence-role-migration-v01.ps1'
          )) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $allErrors += @($errors | ForEach-Object { "$path`: $($_.Message)" })
            }
          }
          if ($allErrors.Count -gt 0) { $allErrors -join "`n" | Write-Error }
      - name: Run schema, planner and migration preparation tests
        run: |
          node --test \
            tests/radar-public-release-v01.test.mjs \
            tests/radar-public-records-schema.test.mjs \
            tests/radar-public-release-plan-v01.test.mjs \
            tests/radar-public-records-migration-preparation.test.mjs \
            tests/radar-public-record-fact-value-text-migration-preparation.test.mjs \
            tests/radar-public-record-evidence-role-migration-preparation.test.mjs
      - name: Confirm generated migrations agree with the collection
        run: |
          if find src/migrations -maxdepth 1 -type f -name '*_radar_public_records_v01.ts' | grep -q .; then
            grep -R 'CREATE TABLE "radar_public_records"' src/migrations/*_radar_public_records_v01.ts
            grep -q 'RADAR_PUBLIC_RECORDS_SCHEMA_READY' payload.config.ts
            grep -q 'RadarPublicRecordsWithAudit' payload.config.ts
          fi
          grep -R 'ALTER TYPE "public"."enum_radar_public_records_evidence_role" ADD VALUE' \
            src/migrations/*_radar_public_record_evidence_role_v01.ts
          grep -R "licensed_or_authorized" \
            src/migrations/*_radar_public_record_evidence_role_v01.ts \
            src/collections/RadarPublicRecords.ts
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
