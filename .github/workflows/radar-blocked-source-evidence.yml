name: Radar blocked source evidence

on:
  push:
    branches:
      - agent/radar-blocked-research-all-v01
    paths:
      - .github/workflows/radar-blocked-source-evidence.yml
      - scripts/radar/assemble-radar-blocked-source-ids.mjs
      - scripts/radar/fetch-radar-blocked-source-evidence.mjs
      - data/radar-blocked-research/source-ids.*.part
  pull_request:
    branches:
      - agent/radar-public-conclusions-v01
    paths:
      - .github/workflows/radar-blocked-source-evidence.yml
      - scripts/radar/assemble-radar-blocked-source-ids.mjs
      - scripts/radar/fetch-radar-blocked-source-evidence.mjs
      - data/radar-blocked-research/source-ids.*.part

permissions:
  contents: read

jobs:
  fetch-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out private research branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate scripts
        run: |
          node --check scripts/radar/assemble-radar-blocked-source-ids.mjs
          node --check scripts/radar/fetch-radar-blocked-source-evidence.mjs

      - name: Assemble and verify source IDs
        run: node scripts/radar/assemble-radar-blocked-source-ids.mjs

      - name: Fetch public structured evidence
        run: |
          mkdir -p exports
          node scripts/radar/fetch-radar-blocked-source-evidence.mjs 2>&1 | tee exports/radar-blocked-source-evidence-actions.log

      - name: Pack evidence cache
        run: |
          tar -czf radar-blocked-source-evidence.tar.gz \
            -C exports \
            radar-blocked-source-evidence \
            radar-blocked-source-evidence-actions.log
          ls -lh radar-blocked-source-evidence.tar.gz
          sha256sum radar-blocked-source-evidence.tar.gz

      - name: Upload packed evidence cache
        uses: actions/upload-artifact@v4
        with:
          name: radar-blocked-source-evidence-packed
          path: radar-blocked-source-evidence.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
